name: Go live on ziezezingen.be (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type LIVE to publish to ziezezingen.be'
        required: true

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'LIVE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache-bust CSS/JS
        run: sed -i "s/__BUILD_VERSION__/${{ github.sha }}/g" *.html

      - name: Live settings (search engines allowed in, redirects for old pages)
        run: |
          sed -i '/TEMP while on the staging domain/d; /<meta name="robots" content="noindex, nofollow">/d' *.html
          printf 'User-agent: *\nAllow: /\nSitemap: https://ziezezingen.be/sitemap.xml\n' > robots.txt
          for p in events:/events.html boekons:/contact.html videos:/video.html troost:/events.html bio:/ zie-ze-zingen:/ sociale-innovatie:/; do
            dir="${p%%:*}"; target="${p##*:}"
            mkdir -p "$dir"
            printf '<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0; url=%s"><link rel="canonical" href="https://ziezezingen.be%s"><title>Zie Ze Zingen</title></head><body><a href="%s">Ga verder naar Zie Ze Zingen</a></body></html>' "$target" "$target" "$target" > "$dir/index.html"
          done

      - name: Generate /nieuwsbrief
        run: |
          mkdir -p nieuwsbrief
          sed 's#<head>#<head><base href="/">#' index.html > nieuwsbrief/index.html

      - name: Write Mailchimp config
        run: |
          cat > mailchimp-config.php <<EOF
          <?php
          define('MAILCHIMP_API_KEY', '${{ secrets.MAILCHIMP_API_KEY }}');
          EOF

      - name: Deploy via SFTP to the real site
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './*'
          remote_path: /webroots/www
          sftpArgs: '-o ConnectTimeout=10'
