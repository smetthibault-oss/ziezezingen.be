name: Deploy to one.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache-bust CSS/JS with the commit SHA
        run: sed -i "s/__BUILD_VERSION__/${{ github.sha }}/g" *.html

      - name: Write Mailchimp config (from secret, never committed)
        run: |
          cat > mailchimp-config.php <<EOF
          <?php
          define('MAILCHIMP_API_KEY', '${{ secrets.MAILCHIMP_API_KEY }}');
          EOF

      - name: Write GitHub OAuth config for the CMS (from secrets, never committed)
        run: |
          cat > oauth/oauth-config.php <<EOF
          <?php
          define('GITHUB_OAUTH_CLIENT_ID', '${{ secrets.GITHUB_OAUTH_CLIENT_ID }}');
          define('GITHUB_OAUTH_CLIENT_SECRET', '${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}');
          EOF

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_SERVER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftpArgs: '-o ConnectTimeout=10'
